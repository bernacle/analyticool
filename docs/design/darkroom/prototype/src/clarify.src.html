<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarify · Net revenue after fees · Analyticool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="components.css">
<style>
  /* Clarify — "Which of these did you mean?" One business question at a time. */
  .col { --col: 680px; }
  .canvas { padding-top: 72px; }
  .building { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .building li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .building li.done { color: var(--ink); } .building li.wait { color: var(--faint); }
  .building svg { width: 16px; height: 16px; flex: none; }
  .building .ring { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); flex: none; }
  .building .spin { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink); border-right-color: transparent; animation: spin 700ms linear infinite; flex: none; }
</style>
</head>
<body class="grain">
<div class="app">
  {{SHELL}}
  <main class="canvas">
    <div class="col">
      <form id="clarify" data-step="0" novalidate>
        <div class="q-meta"><span id="q-count">Question 1 of 2</span><span class="q-bar" aria-hidden="true"><i class="on"></i><i></i></span></div>
        <div id="q-body" aria-live="polite">
          <h1 class="q-title" id="q-title"></h1>
          <p class="lead" id="q-why"></p>
          <div class="options" role="radiogroup" aria-labelledby="q-title" id="q-options"></div>
          <button type="button" class="disclose-btn" aria-expanded="false" aria-controls="q-tech" id="q-tech-btn">How this changes the query<svg aria-hidden="true"><use href="icons.svg#chev"/></svg></button>
          <div class="techbox" id="q-tech" hidden></div>
        </div>
        <div class="q-actions">
          <div class="left">
            <button type="button" class="btn btn-quiet" id="q-back" hidden><svg aria-hidden="true" class="ico"><use href="icons.svg#back"/></svg>Question 1</button>
            <button type="submit" class="btn btn-primary" id="q-next" aria-disabled="true"><span class="spin" aria-hidden="true"></span><span data-label>Continue</span></button>
            <button type="button" class="btn btn-quiet" id="q-rec">Use recommended</button>
          </div>
          <span class="hint" aria-hidden="true"><span class="kbd">1</span><span class="kbd">2</span> choose <span class="kbd">↵</span> continue</span>
        </div>
      </form>
      <section id="building" hidden aria-live="polite">
        <h1 class="q-title" tabindex="-1">Building the definition</h1>
        <p class="lead">Usually under ten seconds. Nothing is saved until you approve it.</p>
        <ul class="building" style="margin-top:24px">
          <li class="done"><svg aria-hidden="true" style="color:var(--ok)"><use href="icons.svg#check"/></svg>Found charges, refunds and fees</li>
          <li id="b2"><span class="spin" aria-hidden="true"></span>Matching refunds to charges</li>
          <li class="wait" id="b3"><span class="ring" aria-hidden="true"></span>Checking against your Stripe payouts</li>
        </ul>
      </section>
    </div>
  </main>
</div>
<script>
  window.CLARIFY = [
    { q: 'When a customer gets a refund, which month should it come out of?', why: 'This decides how past months look once refunds arrive. You can change it later.',
      opts: [['The month the refund happened', 'Matches your bank payouts. Closed months never change.', true], ['The month of the original sale', 'Shows each month’s true outcome, but past months shift as refunds arrive.', false]],
      tech: ['refunds grouped by refunds.created, not charges.created', 'moves $2,310 between months over the last year'] },
    { q: 'Some customers pay in euros and pounds. Which exchange rate should we use?', why: '14% of your charges aren’t in US dollars.',
      opts: [['The rate Stripe actually paid you', 'Matches the dollars that landed in your bank account.', true], ['The daily market rate', 'Matches how your finance team reports, but won’t tie to payouts.', false]],
      tech: ['balance_transactions.exchange_rate, not finance.fx_rates_daily', 'changes October by up to $1,140 (0.22%)'] },
  ];
</script>
<script src="data.js"></script><script src="app.js"></script>
</body>
</html>
